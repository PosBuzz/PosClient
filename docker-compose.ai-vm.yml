version: '3.8'

services:
  # Ollama (LLM Server)
  ollama:
    image: ollama/ollama:latest
    container_name: posbuzz-ollama
    restart: unless-stopped
    env_file:
      - ./ai-service/.env
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - posbuzz-network
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Start Ollama in the background
        /bin/ollama serve &
        # Wait for Ollama to be ready
        until ollama list &>/dev/null; do
          echo "Waiting for Ollama to start..."
          sleep 2
        done
        # Pull the model if not already present
        if ! ollama list | grep -q "${LLM_MODEL:-llama3:8b-instruct-q8_0}"; then
          echo "Pulling model ${LLM_MODEL:-llama3:8b-instruct-q8_0}..."
          ollama pull ${LLM_MODEL:-llama3:8b-instruct-q8_0}
        else
          echo "Model ${LLM_MODEL:-llama3:8b-instruct-q8_0} already exists"
        fi
        # Keep the container running
        wait
    # Uncomment below if you have NVIDIA GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # AI Service (FastAPI)
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
      args:
        - ENVIRONMENT=${ENVIRONMENT:-production}
    container_name: posbuzz-ai-service
    restart: unless-stopped
    env_file:
      - ./ai-service/.env
    volumes:
      - ai_service_data:/app/data
      - huggingface_cache:/app/.cache/huggingface
    ports:
      - "${AI_SERVICE_PORT:-8001}:8001"
    depends_on:
      - ollama
    networks:
      - posbuzz-network

networks:
  posbuzz-network:
    driver: bridge

volumes:
  ollama_data:
    driver: local
  ai_service_data:
    driver: local
  huggingface_cache:
    driver: local
