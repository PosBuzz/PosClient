server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Never cache the entry point: it references the hashed asset filenames,
    # so a stale copy pins users to the previous deploy until a hard reload.
    # "no-cache" still allows a cheap 304 revalidation.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        expires off;
    }

    # Content-hashed build output can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 1y;
    }

    # User manual PDF: always revalidated so a new edition is picked up,
    # and a missing file is a 404, never the app shell.
    location /manual/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
