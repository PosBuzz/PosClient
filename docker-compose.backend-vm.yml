version: '3.8'

services:
  # Backend API (NestJS)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - NODE_ENV=${NODE_ENV:-production}
    container_name: posbuzz-backend
    restart: unless-stopped
    env_file:
      - .env
      - ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/receipts:/app/receipts
      - ./backend/temp:/app/temp
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - posbuzz-network
    command: sh -c "npx prisma db push --accept-data-loss && npx prisma db seed && npm run start:prod"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/api/v1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Admin Frontend (React/Vite)
  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    container_name: posbuzz-admin
    restart: unless-stopped
    env_file:
      - .env
      - ./admin/.env
    ports:
      - "${ADMIN_PORT:-3001}:80"
    depends_on:
      - backend
    networks:
      - posbuzz-network

  # Consumer Frontend (React/Vite/PWA)
  consumer:
    build:
      context: .
      dockerfile: consumer/Dockerfile
    container_name: posbuzz-consumer
    restart: unless-stopped
    env_file:
      - .env
      - ./consumer/.env
    ports:
      - "${CONSUMER_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - posbuzz-network

networks:
  posbuzz-network:
    driver: bridge
