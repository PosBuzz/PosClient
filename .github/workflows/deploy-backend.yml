name: Deploy Backend Services

on:
  workflow_dispatch:  # Manual trigger only
    # inputs:
    #   confirm:
    #     description: 'Type "deploy" to confirm deployment'
    #     required: true
    #     default: ''

jobs:
  deploy-backend:
    name: Deploy Backend, Admin & Consumer to VM
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read

    steps:
      - name: Require green CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs?check_name=All%20checks" \
            --jq '.check_runs | sort_by(.completed_at) | last | .conclusion')
          echo "All checks conclusion: $conclusion"
          [ "$conclusion" = "success" ] || { echo "::error::CI is not green for ${{ github.sha }}"; exit 1; }

      # - name: Validate Input
      #   run: |
      #     if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
      #       echo "❌ Deployment not confirmed. Please type 'deploy' to proceed."
      #       exit 1
      #     fi
      #     echo "✅ Deployment confirmed"

      - name: Deploy to Backend VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.BACKEND_VM_HOST }}
          username: ${{ secrets.BACKEND_VM_USER }}
          key: ${{ secrets.BACKEND_VM_SSH_KEY }}
          port: ${{ secrets.BACKEND_VM_SSH_PORT || 22 }}
          script_stop: true
          script: |
            echo "=========================================="
            echo "🚀 Starting Backend Services Deployment"
            echo "=========================================="
            
            # Navigate to project directory
            cd PosClient
            echo "📁 Current directory: $(pwd)"
            
            # Pull latest code
            echo "📥 Pulling latest code..."
            chmod +x pull.sh
            ./pull.sh
            
            # Build and start services
            echo "🐳 Building and starting Docker containers..."
            docker-compose -f docker-compose.backend-vm.yml up -d --build
            
            # Wait for services to be healthy
            echo "⏳ Waiting for services to start..."
            sleep 15
            
            # Check service status
            echo "📊 Service Status:"
            docker-compose -f docker-compose.backend-vm.yml ps
            
            # Check backend logs
            echo ""
            echo "📋 Backend logs:"
            docker-compose -f docker-compose.backend-vm.yml logs --tail=30 backend
            
            # Check admin logs
            echo ""
            echo "📋 Admin logs:"
            docker-compose -f docker-compose.backend-vm.yml logs --tail=20 admin
            
            # Check consumer logs
            echo ""
            echo "📋 Consumer logs:"
            docker-compose -f docker-compose.backend-vm.yml logs --tail=20 consumer
            
            echo ""
            echo "=========================================="
            echo "✅ Backend Services Deployment Complete!"
            echo "=========================================="

      - name: Deployment Summary
        if: success()
        run: |
          echo "### ✅ Backend Services Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed to:** ${{ secrets.BACKEND_VM_HOST }}" >> $GITHUB_STEP_SUMMARY
          echo "**Services:** Backend API, Admin Frontend, Consumer Frontend" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

      - name: Deployment Failed
        if: failure()
        run: |
          echo "### ❌ Backend Services Deployment Failed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Please check the logs above for details." >> $GITHUB_STEP_SUMMARY
