name: Nightly
permissions:
  contents: read

on:
  schedule:
    - cron: "0 20 * * *" # 02:00 Asia/Dhaka
  workflow_dispatch:

jobs:
  changes:
    name: Changes since last night
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -n "$(git log --since='25 hours ago' --oneline -1)" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; echo "No commits in the last 25h; skipping nightly."; fi

  backend-mutation-domain:
    name: Backend mutation (domain ${{ matrix.shard }}/8)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Lockfiles stay unchanged
        working-directory: .
        run: git diff --exit-code HEAD -- backend/package-lock.json consumer/package-lock.json admin/package-lock.json e2e/package-lock.json
      - run: npx prisma generate
      - run: npm run test:mutation:shard
        env:
          TZ: UTC
          STRYKER_SHARD: ${{ matrix.shard }}/8
          # Jest workers in long Stryker runs grow past Node's default heap and get restarted.
          NODE_OPTIONS: --max-old-space-size=3072
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-domain-mutation-shard-${{ matrix.shard }}
          path: backend/reports/stryker
          retention-days: 14
      - if: always()
        run: docker compose -f ../docker-compose.test.yml down

  backend-mutation-gate:
    name: Backend mutation tier gate
    needs: [changes, backend-mutation-domain]
    if: always() && needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node --test scripts/mutation-tier-gate.test.mjs
      - uses: actions/download-artifact@v4
        with:
          pattern: backend-domain-mutation-shard-*
          path: backend/reports/shards
      - name: Gate merged shard reports
        run: |
          set -e
          test "${{ needs.backend-mutation-domain.result }}" = success
          node scripts/mutation-tier-gate.mjs reports/shards/*/*.mutation.json
      - if: failure()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Nightly failure: backend-mutation-domain" --body "Run and shard artifacts: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || gh issue comment "$(gh issue list --search 'Nightly failure: backend-mutation-domain in:title' --json number --jq '.[0].number')" --body "Failed again: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  consumer-mutation-full:
    name: Consumer mutation (${{ matrix.target }})
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target:
          - src/utils/calculate-totals.utils.ts
          - src/utils/sale-item.utils.ts
          - src/utils/promotion-validation.ts
          - src/utils/promotion-helpers.utils.ts
          - src/utils/formatters.ts
          - src/utils/payment-provider.utils.ts
          - src/utils/invalidate-sales-reports.ts
          - src/api/axiosInstance.ts
          - src/components/RequireAuth.tsx
          - src/components/RequirePermission.tsx
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        working-directory: consumer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: consumer/package-lock.json
      - run: npm ci
      - name: Lockfiles stay unchanged
        working-directory: .
        run: git diff --exit-code HEAD -- backend/package-lock.json consumer/package-lock.json admin/package-lock.json e2e/package-lock.json
      - run: rm -rf reports/stryker
      - run: node --test scripts/mutation-cache.test.mjs && npm run test:mutation -- ${{ matrix.target }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: consumer-mutation-report-${{ strategy.job-index }}
          path: consumer/reports/stryker
          retention-days: 14
      - if: failure()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Nightly failure: consumer-mutation ${{ matrix.target }}" --body "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || gh issue comment "$(gh issue list --search 'Nightly failure: consumer-mutation ${{ matrix.target }} in:title' --json number --jq '.[0].number')" --body "Failed again: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  backend-tz-matrix:
    name: Backend integration (TZ ${{ matrix.tz }})
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        tz: [UTC, Asia/Dhaka, America/New_York]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Lockfiles stay unchanged
        working-directory: .
        run: git diff --exit-code HEAD -- backend/package-lock.json consumer/package-lock.json admin/package-lock.json e2e/package-lock.json
      - run: npx prisma generate
      - run: npx jest --config ./test/jest-integration.json
        env:
          TZ: ${{ matrix.tz }}
      - if: failure()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TZ_NAME: ${{ matrix.tz }}
        run: |
          gh issue create --title "Nightly failure: backend-tz-matrix ($TZ_NAME)" --body "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true

  e2e-repeat:
    name: Full-stack E2E (3x)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            e2e/package-lock.json
            backend/package-lock.json
            consumer/package-lock.json
            admin/package-lock.json
      - run: npm ci
      - name: Lockfiles stay unchanged
        working-directory: .
        run: git diff --exit-code HEAD -- backend/package-lock.json consumer/package-lock.json admin/package-lock.json e2e/package-lock.json
      - run: npx playwright install --with-deps chromium
      - run: node --test scripts/login-budget.test.mjs
      - run: npm run prepare:stack -- --install
      - run: npx playwright test --repeat-each=3
        env:
          CI: "true"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-nightly
          path: e2e/playwright-report
          retention-days: 14
      - if: failure()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Nightly failure: e2e-repeat" --body "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
