name: Deploy AI Service

on:
  workflow_dispatch:  # Manual trigger only
    # inputs:
    #   confirm:
    #     description: 'Type "deploy" to confirm deployment'
    #     required: true
    #     default: ''

jobs:
  deploy-ai-service:
    name: Deploy AI Service to VM
    runs-on: ubuntu-latest
    
    steps:
      # - name: Validate Input
        # run: |
        #   if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
        #     echo "❌ Deployment not confirmed. Please type 'deploy' to proceed."
        #     exit 1
        #   fi
        #   echo "✅ Deployment confirmed"

      - name: Deploy to AI Service VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AI_VM_HOST }}
          username: ${{ secrets.AI_VM_USER }}
          key: ${{ secrets.AI_VM_SSH_KEY }}
          port: ${{ secrets.AI_VM_SSH_PORT || 22 }}
          script_stop: true
          script: |
            echo "=========================================="
            echo "🚀 Starting AI Service Deployment"
            echo "=========================================="
            
            # Navigate to project directory
            cd PosClient
            echo "📁 Current directory: $(pwd)"
            
            # Pull latest code
            echo "📥 Pulling latest code..."
            chmod +x pull.sh
            ./pull.sh
            
            # Build and start services
            echo "🐳 Building and starting Docker containers..."
            docker-compose -f docker-compose.ai-vm.yml up -d --build
            
            # Wait for services to be healthy
            echo "⏳ Waiting for services to start..."
            sleep 10
            
            # Check service status
            echo "📊 Service Status:"
            docker-compose -f docker-compose.ai-vm.yml ps
            
            # Check logs
            echo ""
            echo "📋 Recent logs:"
            docker-compose -f docker-compose.ai-vm.yml logs --tail=50 ai-service
            
            echo ""
            echo "=========================================="
            echo "✅ AI Service Deployment Complete!"
            echo "=========================================="

      - name: Deployment Summary
        if: success()
        run: |
          echo "### ✅ AI Service Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed to:** ${{ secrets.AI_VM_HOST }}" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY

      - name: Deployment Failed
        if: failure()
        run: |
          echo "### ❌ AI Service Deployment Failed!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Please check the logs above for details." >> $GITHUB_STEP_SUMMARY
