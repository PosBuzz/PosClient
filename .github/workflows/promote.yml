name: Promote to production

# Manual: ship a commit that is already running on staging to production
# (posbuzz.xyz). backend/portfolio images are reused exactly as staging tested
# them; only the admin/consumer bundles are rebuilt, because they embed the
# API URL at build time.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to promote. Must have deployed to staging successfully. Defaults to the commit currently on staging.
        required: false

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  checks: read
  actions: read

jobs:
  guard:
    name: Resolve commit
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          repo=${{ github.repository }}
          if [ -n "$INPUT_SHA" ]; then
            sha="$INPUT_SHA"
          else
            sha=$(gh api "repos/$repo/actions/workflows/deploy.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].head_sha')
          fi
          [ -n "$sha" ] || { echo "::error::no successful staging deploy found"; exit 1; }
          # Staging must have deployed exactly this commit successfully.
          ok=$(gh api "repos/$repo/actions/workflows/deploy.yml/runs?status=success&head_sha=$sha" --jq '.total_count')
          [ "$ok" -ge 1 ] || { echo "::error::$sha has not deployed to staging successfully"; exit 1; }
          conclusion=$(gh api "repos/$repo/commits/$sha/check-runs?check_name=All%20checks" \
            --jq '.check_runs | sort_by(.completed_at) | last | .conclusion')
          [ "$conclusion" = success ] || { echo "::error::CI is not green for $sha"; exit 1; }
          echo "promoting $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build:
    name: Build production image (${{ matrix.app }})
    needs: guard
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        app: [admin, consumer]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.app }}/Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=https://api.posbuzz.xyz/api/v1
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.guard.outputs.sha }}
          tags: |
            ghcr.io/posbuzz/posclient-${{ matrix.app }}:${{ needs.guard.outputs.sha }}-prod
          cache-from: type=gha,scope=${{ matrix.app }}-prod
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}-prod

  deploy:
    name: Deploy to production
    needs: [guard, build]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.guard.outputs.sha }}
      - name: Roll out
        env:
          SHA: ${{ needs.guard.outputs.sha }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          { printf '%s\n' "$GHCR_TOKEN"; tar -c -C deploy docker-compose.prod.yml deploy.sh refresh-staging.sh; } \
            | ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=yes -o BatchMode=yes \
                "$DEPLOY_USER@$HOST" "deploy production $SHA"

  verify:
    name: Verify production
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Smoke test
        run: |
          set -euo pipefail
          code() { curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$1"; }
          header() { curl -sI --max-time 20 "$1" | tr -d '\r' | grep -i "^$2:" | cut -d' ' -f2- | tr 'A-Z' 'a-z'; }
          [ "$(code https://api.posbuzz.xyz/api/v1)" = 200 ]
          [ "$(code https://admin.posbuzz.xyz/)" = 200 ]
          [ "$(code https://posbuzz.xyz/)" = 200 ]
          [ "$(code https://portfolio.posbuzz.xyz/)" = 200 ]
          header https://posbuzz.xyz/ cache-control | grep -q 'no-cache'
          header https://admin.posbuzz.xyz/ cache-control | grep -q 'no-cache'
          header https://posbuzz.xyz/sw.js cache-control | grep -q 'no-store'
          echo "production OK"

  prune:
    name: Prune old images (${{ matrix.app }})
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [backend, admin, consumer, portfolio]
    steps:
      - uses: actions/delete-package-versions@v5
        with:
          package-name: posclient-${{ matrix.app }}
          package-type: container
          min-versions-to-keep: 30
