server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # PWA service worker - must always be revalidated so autoUpdate can fire.
    location ~ ^/(sw\.js|workbox-.*\.js|registerSW\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        proxy_cache_bypass $http_pragma;
        proxy_cache_revalidate on;
        expires off;
        access_log off;
    }

    # Never cache the entry point: it references the hashed asset filenames,
    # so a stale copy pins users to the previous deploy until a hard reload.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        expires off;
    }

    # Content-hashed build output can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 1y;
    }

    # PWA manifest and icons
    location ~ \.(webmanifest|png|svg|ico)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    # Print server installer: always revalidated so a new release is picked up,
    # and a missing file is a 404, never the app shell.
    location /print-server/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # User manual PDF: always revalidated so a new edition is picked up,
    # and a missing file is a 404, never the app shell.
    location /manual/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
