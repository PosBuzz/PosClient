version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: posbuzz-postgres
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      POSTGRES_DB: ${DB_NAME:-posbuzz}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - posbuzz-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: posbuzz-redis
    restart: unless-stopped
    env_file:
      - .env.docker
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - posbuzz-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: posbuzz-rabbitmq
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"  # Management UI
    networks:
      - posbuzz-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Backend API (NestJS)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - NODE_ENV=${NODE_ENV:-production}
    container_name: posbuzz-backend
    restart: unless-stopped
    env_file:
      - .env.docker
      - ./backend/.env.docker
    environment:
      # Override with Docker network hostnames
      DB_HOST: postgres
      REDIS_HOST: redis
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
      FASTAPI_URL: http://ai-service:8001/api/v1
      DATABASE_URL: postgresql://${DB_USERNAME:-postgres}:${DB_PASSWORD:-postgres}@postgres:${DB_PORT:-5432}/${DB_NAME:-posbuzz}?schema=public
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/receipts:/app/receipts
      - ./backend/temp:/app/temp
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - posbuzz-network
    command: sh -c "npx prisma db push && npx prisma db seed && npm run start:prod"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/api/v1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Ollama (LLM Server)
  ollama:
    image: ollama/ollama:latest
    container_name: posbuzz-ollama
    restart: unless-stopped
    env_file:
      - .env.docker
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - posbuzz-network
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        # Start Ollama in the background
        /bin/ollama serve &
        # Wait for Ollama to be ready
        until ollama list &>/dev/null; do
          echo "Waiting for Ollama to start..."
          sleep 2
        done
        # Pull the model if not already present
        if ! ollama list | grep -q "${LLM_MODEL:-llama3:8b-instruct-q8_0}"; then
          echo "Pulling model ${LLM_MODEL:-llama3:8b-instruct-q8_0}..."
          ollama pull ${LLM_MODEL:-llama3:8b-instruct-q8_0}
        else
          echo "Model ${LLM_MODEL:-llama3:8b-instruct-q8_0} already exists"
        fi
        # Keep the container running
        wait
    # Uncomment below if you have NVIDIA GPU support
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # AI Service (FastAPI)
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
      args:
        - ENVIRONMENT=${ENVIRONMENT:-production}
    container_name: posbuzz-ai-service
    restart: unless-stopped
    env_file:
      - .env.docker
      - ./ai-service/.env.docker
    environment:
      # Override with Docker network hostnames
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672/
      REDIS_HOST: redis
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - ai_service_data:/app/data
      - huggingface_cache:/app/.cache/huggingface
    ports:
      - "${AI_SERVICE_PORT:-8001}:8001"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - posbuzz-network

  # Admin Frontend (React/Vite)
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8000}
    container_name: posbuzz-admin
    restart: unless-stopped
    env_file:
      - ./admin/.env.docker
    ports:
      - "${ADMIN_PORT:-3001}:80"
    networks:
      - posbuzz-network

  # Consumer Frontend (React/Vite/PWA)
  consumer:
    build:
      context: ./consumer
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_CONSUMER_API_URL:-http://localhost:8000}
    container_name: posbuzz-consumer
    restart: unless-stopped
    env_file:
      - ./consumer/.env.docker
    ports:
      - "${CONSUMER_PORT:-3000}:80"
    networks:
      - posbuzz-network

networks:
  posbuzz-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  ollama_data:
    driver: local
  ai_service_data:
    driver: local
  huggingface_cache:
    driver: local
