version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: posbuzz-postgres
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      POSTGRES_DB: ${DB_NAME:-posbuzz}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - posbuzz-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Adminer - Database Management UI
  adminer:
    image: adminer:latest
    container_name: posbuzz-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    networks:
      - posbuzz-network
    depends_on:
      postgres:
        condition: service_healthy

  # Backend API (NestJS)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - NODE_ENV=${NODE_ENV:-production}
    container_name: posbuzz-backend
    restart: unless-stopped
    env_file:
      - .env.docker
      - ./backend/.env.docker
    environment:
      DB_HOST: postgres
      DATABASE_URL: postgresql://${DB_USERNAME:-postgres}:${DB_PASSWORD:-postgres}@postgres:${DB_PORT:-5432}/${DB_NAME:-posbuzz}?schema=public
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/receipts:/app/receipts
      - ./backend/temp:/app/temp
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - posbuzz-network
    command: sh -c "npx prisma migrate deploy && npm run start:prod"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/api/v1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Admin Frontend (React/Vite)
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: posbuzz-admin
    restart: unless-stopped
    env_file:
      - ./admin/.env.docker
    ports:
      - "${ADMIN_PORT:-3001}:80"
    networks:
      - posbuzz-network

  # Consumer Frontend (React/Vite/PWA)
  consumer:
    build:
      context: ./consumer
      dockerfile: Dockerfile
    container_name: posbuzz-consumer
    restart: unless-stopped
    env_file:
      - ./consumer/.env.docker
    ports:
      - "${CONSUMER_PORT:-3000}:80"
    networks:
      - posbuzz-network

  # Portfolio & Landing Hub (Next.js / SEO / AEO)
  portfolio:
    build:
      context: ./portfolio
      dockerfile: Dockerfile
      args:
        # Lets pages prerender against live CMS content when the backend is
        # reachable at build time; otherwise they fall back to bundled copy and
        # refresh on first revalidation.
        - BACKEND_API_URL=${BACKEND_API_URL:-http://backend:8000/api/v1}
    container_name: posbuzz-portfolio
    restart: unless-stopped
    ports:
      - "${PORTFOLIO_PORT:-3002}:3000"
    env_file:
      - ./portfolio/.env.docker
    networks:
      - posbuzz-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3


networks:
  posbuzz-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
