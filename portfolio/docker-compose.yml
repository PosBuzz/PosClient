version: '3.8'

services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BACKEND_API_URL=${BACKEND_API_URL:-http://backend:8000/api/v1}
    container_name: posbuzz-portfolio
    restart: unless-stopped
    ports:
      - "${PORTFOLIO_PORT:-3002}:3000"
    env_file:
      - .env.docker
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
