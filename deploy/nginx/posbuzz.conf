# Host nginx for the VPS: one public entry point for both environments.
# Production = posbuzz.xyz (ports 3000/3001/3002/8000), staging = posbuzz.cloud
# (ports 4000/4001/4002/4800). Install: /etc/nginx/sites-enabled/posbuzz, nginx -t, reload.
map $host $upstream {
    hostnames;
    default                 127.0.0.1:3000;   # production consumer (posbuzz.xyz and unknown hosts)
    api.posbuzz.xyz         127.0.0.1:8000;
    admin.posbuzz.xyz       127.0.0.1:3001;
    portfolio.posbuzz.xyz   127.0.0.1:3002;
    .posbuzz.cloud          127.0.0.1:4000;   # staging consumer (apex and any subdomain)
    api.posbuzz.cloud       127.0.0.1:4800;
    admin.posbuzz.cloud     127.0.0.1:4001;
    portfolio.posbuzz.cloud 127.0.0.1:4002;
}

server {
    listen 80;
    server_name .posbuzz.cloud .posbuzz.xyz;
    return 301 https://$host$request_uri;
}

# Shared proxy settings for the two wildcard hosts below.
server {
    listen 443 ssl http2;
    server_name .posbuzz.xyz;

    ssl_certificate /etc/letsencrypt/live/posbuzz.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/posbuzz.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 50M;

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    location / {
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 443 ssl http2;
    server_name .posbuzz.cloud;

    ssl_certificate /etc/letsencrypt/live/posbuzz.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/posbuzz.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 50M;

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    # Staging must never be indexed.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# posbuzz.com has no DNS record yet; kept so the cert/config is ready when it does.
server {
    listen 80;
    listen [::]:80;
    server_name posbuzz.com www.posbuzz.com;
    return 301 https://posbuzz.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.posbuzz.com;
    ssl_certificate /etc/letsencrypt/live/posbuzz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/posbuzz.com/privkey.pem;
    return 301 https://posbuzz.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name posbuzz.com;
    ssl_certificate /etc/letsencrypt/live/posbuzz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/posbuzz.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 50M;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
