# Host nginx for the VPS: one public entry point for both environments.
# Production = posbuzz.xyz (ports 3000/3001/3002/8000), staging = posbuzz.cloud
# (ports 4000/4001/4002/4800). Install: /etc/nginx/sites-enabled/posbuzz, nginx -t, reload.
map $host $upstream {
    hostnames;
    default                 127.0.0.1:3000;   # production consumer (posbuzz.xyz and unknown hosts)
    api.posbuzz.xyz         127.0.0.1:8000;
    admin.posbuzz.xyz       127.0.0.1:3001;
    portfolio.posbuzz.xyz   127.0.0.1:3002;
    .posbuzz.cloud          127.0.0.1:4000;   # staging consumer (apex and any subdomain)
    api.posbuzz.cloud       127.0.0.1:4800;
    admin.posbuzz.cloud     127.0.0.1:4001;
    portfolio.posbuzz.cloud 127.0.0.1:4002;
}

# Full Content-Security-Policy, REPORT-ONLY for now (violations show in the browser
# console, nothing is blocked). Promote it to Content-Security-Policy once a staging
# click-through shows no violations. API hosts send JSON only: no policy.
# SPAs (consumer, admin): no inline scripts; antd injects inline styles; images come
# from Cloudinary / ibb / placehold; uploads go to api.cloudinary.com; the PWA needs
# a worker. Portfolio (Next.js) has inline hydration scripts. Cloudflare Web Analytics
# injects its beacon (static.cloudflareinsights.com) into proxied pages, so it is allowed.
map $host $csp_report_only {
    hostnames;
    default "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://res.cloudinary.com https://i.ibb.co https://placehold.co; font-src 'self' data:; connect-src 'self' https://cloudflareinsights.com https://api.posbuzz.xyz https://api.posbuzz.cloud https://api.cloudinary.com; worker-src 'self' blob:; manifest-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
    portfolio.posbuzz.xyz   "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://cloudflareinsights.com https://api.posbuzz.xyz https://api.posbuzz.cloud; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
    portfolio.posbuzz.cloud "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://cloudflareinsights.com https://api.posbuzz.xyz https://api.posbuzz.cloud; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
    api.posbuzz.xyz         "";
    api.posbuzz.cloud       "";
}

# The API sets its own CSP and HSTS (stronger: 1 year + includeSubDomains), so nginx
# adds these two only for the frontend hosts (an empty value omits the header).
map $host $hsts_value {
    hostnames;
    default "max-age=31536000";
    api.posbuzz.xyz   "";
    api.posbuzz.cloud "";
}
map $host $csp_enforced {
    hostnames;
    default "frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self'";
    api.posbuzz.xyz   "";
    api.posbuzz.cloud "";
}

server {
    listen 80;
    server_name .posbuzz.cloud .posbuzz.xyz;
    return 301 https://$host$request_uri;
}

# Shared proxy settings for the two wildcard hosts below.
server {
    listen 443 ssl http2;
    server_name .posbuzz.xyz;

    ssl_certificate /etc/letsencrypt/live/posbuzz.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/posbuzz.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 50M;

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    # HSTS is one year. No includeSubDomains/preload on purpose (both are hard to undo).
    # Cloudflare is in Full (strict) mode, so the origin HTTP->HTTPS redirect is never hit
    # by Cloudflare and cannot loop; certificates auto-renew and are monitored.
    add_header Strict-Transport-Security $hsts_value always;
    # Low-risk subset, enforced now: clickjacking, <base> hijack, plugins, form targets.
    add_header Content-Security-Policy $csp_enforced always;
    add_header Content-Security-Policy-Report-Only $csp_report_only always;

    location / {
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 443 ssl http2;
    server_name .posbuzz.cloud;

    ssl_certificate /etc/letsencrypt/live/posbuzz.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/posbuzz.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 50M;

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    # HSTS is one year. No includeSubDomains/preload on purpose (both are hard to undo).
    # Cloudflare is in Full (strict) mode, so the origin HTTP->HTTPS redirect is never hit
    # by Cloudflare and cannot loop; certificates auto-renew and are monitored.
    add_header Strict-Transport-Security $hsts_value always;
    # Low-risk subset, enforced now: clickjacking, <base> hijack, plugins, form targets.
    add_header Content-Security-Policy $csp_enforced always;
    add_header Content-Security-Policy-Report-Only $csp_report_only always;
    # Staging must never be indexed.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# posbuzz.com has no DNS record yet; kept so the cert/config is ready when it does.
server {
    listen 80;
    listen [::]:80;
    server_name posbuzz.com www.posbuzz.com;
    return 301 https://posbuzz.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.posbuzz.com;
    ssl_certificate /etc/letsencrypt/live/posbuzz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/posbuzz.com/privkey.pem;
    return 301 https://posbuzz.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name posbuzz.com;
    ssl_certificate /etc/letsencrypt/live/posbuzz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/posbuzz.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 50M;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
