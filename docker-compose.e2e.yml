services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: posbuzz_e2e_test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d posbuzz_e2e_test"]
      interval: 2s
      timeout: 3s
      retries: 30
